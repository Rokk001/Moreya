# Factions definition file.
# It defines which creatures can spawn through the portal per faction: three per wage class (FeeBase in creatures.cfg).
# Skeleton (from the prison) and Lich (from the crypt) do not come through the portal; the workers come by spell.
# Each Faction is defined with [Factions] [/Factions]
# within a [Faction] [/Faction] tag couple.

[Factions]
[Faction]
    Name	Keeper
    WorkerClass	Kobold
    [SpawnPool]
    # Wage class 50
    Orc
    Cultist
    Ghoul
    # Wage class 100
    Goblin
    CaveHornet
    Witch
    # Wage class 200
    Troll
    LizardMan
    Banshee
    # Wage class 400
    PitDemon
    Vampire
    Butcher
    [/SpawnPool]
[/Faction]
[Faction]
    Name	Hero
    WorkerClass	DwarfWorker
    [SpawnPool]
    # Wage class 50
    Knight
    Monk
    Adventurer
    # Wage class 100
    Hunter
    DarkElf
    Elf
    # Wage class 200
    Dwarf2
    RunelordDwarf
    Wizard
    # Wage class 400
    Paladin
    Priestess
    Defender
    [/SpawnPool]
[/Faction]
[/Factions]
