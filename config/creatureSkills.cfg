# Creature skill trees, tier 4 skills and templates.
# Read by the ConfigManager (CreatureSkillTree::SkillTreeConfig). One key per line, "Key value..." separated by
# whitespace, '#' starts a comment. A block ends with its closing tag. A '-' in a cell means: not used.
#
# [Skill] ... [/Skill]   one skill of a path of a skill group or a skill family (tier 1 to 3, ranks 1 to 5)
#   Id         config id of the skill (e.g. BLK_C3), unique
#   Name       display name (rest of the line)
#   Kind       one token: PASSIVE_<stat> (stat: dmg%, spell%, alldmg%, hp%, crit, cd%, avoid, ar%, dr%, dig%, claim%,
#              carry%, move%, wake%, manacost%), BUFF_SELF_StrengthChange, BUFF_SELF_SpeedChange, BUFF_SELF_Defense,
#              AURA_ALLY_StrengthChange, DEBUFF_Weak, DEBUFF_Slow, EXPLOSION, HAILSTORM, GASCLOUD, GRENADE,
#              GUIDEDBOLT, WHIRLWIND, FREEZE, INVISIBLE, TELEPORT, DRAIN, RAISEDEAD, SKELARMY, STRIKE, HEAL_SELF,
#              HEAL_ALLY, HEAL_AREA, and the kinds of the role groups (see "Role skill kinds" below): TAUNT,
#              PARRY_COUNTER, AURA_ALLY_Defense, BUFF_ALLY_Defense, SHIELD_ALLY, SHIELD_AREA, HEAL_INSTANT, HOT_AREA,
#              HOT_SELF, CURSE_DOT, MARK, HOLD, BLEED, POISON, BURN_DOT, DRAIN_HEAL_ALLIES, CHAIN_LIGHTNING, FLURRY.
#              INVISIBLE stays readable for old content; the roster gives no creature an invisibility skill.
#   Group      skill group of the creature (tank, healer, supporter, warrior, skirmisher, marksman, mage, worker);
#              a family skill has a Family line instead
#   Family     skill family (greenskin, dwarf, undead, vermin, demon, elf, human, arcane, dragonkin, workfolk, blood,
#              beast, stone); a group skill has a Group line instead
#   Path       name of the path (rest of the line); three tiers of one path form a path
#   Tier       1, 2 or 3 (tier 2 needs 1 rank in tier 1, tier 3 needs 2 ranks in tier 2 of the same path)
#   Values     the value of rank 1 to 5, five tokens; WHIRLWIND uses "push/stun" tokens
#   Mana       the mana cost of rank 1 to 5, five numbers, or '-'
#   Cooldown   cooldown in turns, or '-'
#   Duration   duration in turns (the duration column of the base line for damage skills), or '-'
#   Radius     radius in tiles (AURA_ALLY and HEAL_AREA skills and the radius column of a base line), or '-'
#              SKELARMY skills use SkeletonArmyRadius in global.cfg for the radius around the caster.
#   AURA_ALLY skills use AuraAllyMinAllies in global.cfg for the fewest allies inside the radius.
#   Range      range in tiles (debuffs, HEAL_ALLY and the range column of a base line), or '-'
#   BaseLine   the full skill line the skill scales ("ClassName cooldown warmup ..." as in the old skill lists), or '-'.
#              Kinds that scale a damage or control line (EXPLOSION, HAILSTORM, GASCLOUD, GRENADE, GUIDEDBOLT,
#              WHIRLWIND, FREEZE, INVISIBLE, TELEPORT, DRAIN, RAISEDEAD, SKELARMY) need a base line. The rank value
#              multiplies the damage values (min and max) of EXPLOSION, HAILSTORM, GASCLOUD, GRENADE and
#              GUIDEDBOLT lines and the duration of FREEZE; for every other kind it replaces the strength value
#              of the line. For buffs, debuffs, heals and the new kinds a base line is optional and only supplies the
#              warmup of the line; without it the warmup is 0.
#   Skill kinds that heal (HEAL_SELF, HEAL_ALLY, HEAL_AREA): the value is a percent of the own MinHP times the
#   damage multiplier of the Mana attribute level.
#   The mana cost of a rank is paid when the skill starts; manacost% passives reduce it.
#   Rank1      optional: properties the skill has from rank 1 (see "Rank properties" below), or '-'
#   Rank3      optional: the properties the skill gains at rank 3, or '-'
#   Rank5      optional: the properties the skill gains at rank 5, or '-'
#              Each cell is a list of property tokens, every token followed by its numbers, e.g.
#              "Rank3 AREA 3" or "Rank5 SLOW 0.8 10 HEAL_REDUCTION 0.5". The properties add up: rank 3 has the
#              Rank1 and Rank3 properties, rank 5 all three; a token of a higher rank replaces the same token of a
#              lower rank. An unknown token is a load error. Properties of a PASSIVE_ skill act on the whole creature;
#              properties of an active skill act on that skill.
#
# [TierFour] ... [/TierFour]   the single skill of a creature type (rank 1, costs 1 point, needs 20 points spent)
#   Creature   the creature type (class name); its skill id is T4_<Creature>
#   Name, Kind, Cooldown, Duration, Mana, Radius, Range, BaseLine   as in [Skill]
#   Value      the value (a number, or "push/stun" for WHIRLWIND, "blows/factor" for FLURRY)
#   Properties optional: property tokens with their numbers as in Rank1 (the tier 4 skill has one rank), or '-'
#
# Role skill kinds. Unless a kind says otherwise the skill line is built from the table row as
# "<Class> Cooldown warmup LevelMin Range Radius Duration Value" (the base line is optional, as for the heals);
# "heal base" = the own MinHP times the damage multiplier of the Mana attribute level (as for HEAL_ALLY).
#   TAUNT              while the tank fights, the nearest enemy creature within Range that it does not taunt yet must
#                      attack it for Value turns (when it can reach it).
#   PARRY_COUNTER      Value = chance in percent to parry a melee blow that would land (it does no damage). Never cast.
#   AURA_ALLY_Defense  while fighting with at least AuraAllyMinAllies own creatures within Radius: each gets Value
#                      more physical defence for Duration turns.
#   BUFF_ALLY_Defense  the fighting ally within Range with the lowest health share (without this buff) gets Value more
#                      physical defence for Duration turns.
#   SHIELD_ALLY        the fighting ally within Range with the lowest health share (without this shield) gets a shield
#                      that takes Value percent of the heal base of damage, for Duration turns.
#   SHIELD_AREA        while fighting: every own creature within Radius (without this shield) gets such a shield.
#   HEAL_INSTANT       the own creature within Range with the lowest health share below SkillHealAllyBelow is healed
#                      Value percent of the heal base at once.
#   HOT_AREA           when an own creature within Radius is below SkillHealAreaBelow, every own creature within
#                      Radius (without this heal) is healed Value percent of the heal base over Duration turns.
#   HOT_SELF           while fighting below SkillHealSelfBelow: the creature heals itself Value percent of its heal base
#                      over Duration turns.
#   BLEED, POISON, CURSE_DOT, BURN_DOT   the enemy creature within Range takes Value damage in total over Duration
#                      turns (scaled like the other skill tree spells: SkillDamageFactor of the type, level, MinHP
#                      tier and the spell% and alldmg% passives). One effect per skill and target unless STACK.
#   MARK               the enemy creature within Range takes its damage times Value for Duration turns.
#   HOLD               the enemy creature within Range cannot walk for Value turns (it still attacks what it reaches).
#   DRAIN_HEAL_ALLIES  takes Value percent of the full health of the enemy creature within Range and heals the hurt own
#                      creatures within Radius of the caster with it, split evenly (the caster keeps it when none is
#                      hurt).
#   CHAIN_LIGHTNING    a guided bolt: same line, values and base line as GUIDEDBOLT; the jumps come from JUMP_TARGETS.
#   FLURRY             line "Flurry Cooldown warmup LevelMin Range Radius Blows Factor", Value "blows/factor": every enemy
#                      within Radius of the caster gets Blows melee blows of Factor times the own melee blow. The
#                      blows cannot be critical without CAN_CRIT.
#
# Rank properties (keys Rank1, Rank3, Rank5, Properties). "n1", "n2", "n3" are the numbers written after the token;
# factors multiply (below 1 lowers, above 1 raises), shares are 0..1, chances are percent, times are turns.
#   AREA n1            the skill acts on every enemy (allies for heals) within n1 tiles (TAUNT: of the tank; DEBUFF_Slow,
#                      EXPLOSION, MARK, HOLD: of the target; WHIRLWIND: of the caster). Without n1 the Radius cell.
#   EXTRA_TARGETS n1 n2  MARK, HOLD and missile skills also act on up to n1 more enemies nearest the target within n2
#                      tiles (without n2: the range of the skill).
#   JUMP_TARGETS n1 n2 CHAIN_LIGHTNING (and missile skills) also hit up to n1 more enemies nearest the target within n2.
#   LONGER n1          duration times n1 (role kinds, DEBUFF_Slow, FREEZE, HAILSTORM/GASCLOUD, HOLD).
#   LARGER_RADIUS n1   radius times n1 (role kinds, AURA_ALLY_StrengthChange, WHIRLWIND AREA, GRENADE blast,
#                      EXPLOSION AREA, HAILSTORM/GASCLOUD, FLURRY, DEBUFF_Slow AREA).
#   LONGER_RANGE n1    passive: the range of the missile attacks and skills times n1.
#   FASTER_CAST n1     cooldown and warmup of the skill times n1.
#   STACK n1           up to n1 effects of the skill at once on one target (damage over time, MARK, HOLD).
#   LESS_DAMAGE_DEALT n1   TAUNT: the taunted enemies deal their damage times n1.
#   LESS_DAMAGE_TAKEN n1 n2  HEAL_INSTANT: the healed creature takes its damage times n1 for n2 turns.
#   REFLECT n1         shields: share n1 of the absorbed damage goes back to the attacker; passive: share n1 of the
#                      damage taken goes back to the attacker.
#   BLOCK n1           passive: chance n1 that a hit of a creature is blocked completely.
#   SURVIVE_DEADLY n1  passive: once per fight a deadly blow leaves the creature with share n1 of its hit points (at
#                      least 1); HEAL_INSTANT: once per fight of the caster the healed creature is saved from one deadly
#                      blow (keeps 1 hit point) during n1 turns.
#   CONTROL_IMMUNE     AURA_ALLY_Defense: the allies cannot be stunned, knocked down, held, frozen or feared meanwhile.
#   STUN n1            STRIKE: the blow stuns n1 turns; PARRY_COUNTER: the counter blow stuns the attacker n1 turns;
#                      WHIRLWIND: at least n1 turns of stun.
#   KNOCK_DOWN n1      STRIKE and WHIRLWIND: the target falls and cannot act for n1 turns (as a stun).
#   STAGGER n1         passive: a critical melee hit stuns the target n1 turns.
#   FEAR n1            EXPLOSION: every creature hit flees from the caster for n1 turns.
#   PUSH n1            FLURRY: every enemy hit is pushed n1 tiles away.
#   PULL n1            FLURRY and WHIRLWIND: the enemies are pulled up to n1 tiles towards the caster.
#   LOSE_TARGET        WHIRLWIND: the enemies blown away give up their fight.
#   HOLD n1            DEBUFF_Slow: the target is also held in place n1 turns.
#   SLOW n1 n2         damage over time, DEBUFF_Weak, HAILSTORM/GASCLOUD: the target is also slowed to factor n1 for n2
#                      turns (without n2: the duration of the skill).
#   WEAKEN n1 n2       EXPLOSION: every creature hit deals its damage times n1 for n2 turns.
#   SHATTER n1         FREEZE: the frozen creature takes its damage times n1 while it is frozen.
#   CLEANSE            heals (HEAL_SELF, HEAL_ALLY, HEAL_AREA, HEAL_INSTANT, HOT_AREA, HOT_SELF): remove bleeding and
#                      poison from the healed creature.
#   CLEANSE_ALL        as CLEANSE, and also the curses.
#   SPREAD n1          DEBUFF_Weak: also weakens the enemies within n1 tiles of the target.
#   SPREAD_DOT n1      DEBUFF_Weak: the damage over time of the caster on the target spreads to the enemies within n1.
#   SPREAD_ON_DEATH n1 damage over time: when the target dies the effect jumps to its nearest ally within n1 tiles.
#   HEAL_REDUCTION n1  damage over time (or a passive for all damage over time of the creature): the target heals
#                      times n1 while it runs.
#   BLEED_ON_HIT n1 n2 FLURRY: every enemy hit bleeds n1 damage in total (scaled as the skill tree spells) over n2 turns.
#   MAGIC              AURA_ALLY_Defense and BUFF_ALLY_Defense: as much magical and element defence as physical.
#   ALLIES_NEAR n1     BUFF_ALLY_Defense, BUFF_SELF_Defense (and DEFENSE_BOOST): also the own creatures within n1 tiles
#                      of the target.
#   DEFENSE n1         shields: the shielded creature also gets n1 defence while the shield lasts.
#   DEFENSE_BOOST n1 n2 n3 n4  passive: the creature gains a defence boost of n1 for n2 turns with cooldown n3 and mana
#                      cost n4 (optional), used while it fights.
#   HEAL_ON_BREAK n1   shields: a broken shield heals n1 percent of the heal base of the caster.
#   HASTE n1           AURA_ALLY_StrengthChange: the allies attack with their cooldowns times n1.
#   MORE_PER_ATTACKER n1 n2  HEAL_SELF: the heal grows by share n1 for every enemy within n2 tiles.
#   MORE_ON_LOW n1 n2  HOT_AREA, HOT_SELF: the heal is times n1 while the health share of the creature is below n2.
#   BURST_ON_LOW n1 n2 HOT_AREA, HOT_SELF: once, when the health share drops below n2, an extra heal of n1 percent of the
#                      heal base.
#   EXTEND_ON_HIT n1   HOT_SELF (and HOT_AREA): every hit the creature takes extends the heal by n1 turns.
#   REGEN n1           passive: while fighting the creature heals n1 percent of its maximum hit points every turn.
#   MANA_REFUND n1     passive: every tick of a heal over time of the creature gives it n1 mana.
#   MANA_REGEN n1      passive: the mana returns n1 times faster while the creature fights.
#   MANA_DRAIN n1      DRAIN, DRAIN_HEAL_ALLIES: the target also loses n1 times the drained hit points as mana to the
#                      caster.
#   MANA_DISCOUNT n1   passive: the single target spells cost share n1 less mana.
#   MANA_REFUND_ON_KILL n1  passive: a kill by a damage over time of the creature gives it n1 mana.
#   FREE_ON_LOW n1     passive: a heal on a creature below health share n1 costs no mana.
#   FREE_ON_DEBUFFED   passive: a damage over time on a target that carries one already costs no mana.
#   FREE_AREA_CAST     passive: the area skills (FLURRY, WHIRLWIND, GRENADE, EXPLOSION, HAILSTORM, GASCLOUD) cost no mana.
#   COOLDOWN_PER_HIT n1  passive: every enemy a FLURRY hits takes n1 turns off its cooldown.
#   DOUBLE_CAST        FLURRY: the whole flurry is struck twice.
#   DOUBLE_CAST_ONCE   passive: once per fight a heal skips its cooldown (two heals in a row).
#   RESET_ON_KILL      STRIKE: a kill by the armed blow makes the skill ready again.
#   COUNTER n1         PARRY_COUNTER: a parried blow is answered with a melee blow of n1 times the own blow.
#   DODGE_HASTE n1     passive: every dodged melee blow takes n1 turns off the cooldown of the own melee attack.
#   DODGE_COOLDOWN n1  passive: every dodged melee blow takes n1 turns off every cooldown.
#   DODGE_TAUNT_RESET n1  passive: after n1 dodges in a row the taunt is ready again.
#   DODGE_AREA         passive: the creature may dodge FLURRY, WHIRLWIND and EXPLOSION areas (its melee avoidance).
#   CRIT_DAMAGE n1     passive: critical melee hits deal n1 times more.
#   HASTE_ON_CRIT n1 n2  passive: a critical melee hit speeds the creature up to factor n1 for n2 turns.
#   SLOW_ON_CRIT n1 n2 passive: a critical hit (melee or shot) slows the target to factor n1 for n2 turns.
#   PIERCE n1          passive: a critical shot also hits the enemy nearest the target within n1 tiles with the same
#                      damage.
#   CRIT_BEHIND        passive: a melee blow from behind the target (against its facing) is always critical.
#   CAN_CRIT           FLURRY: every blow can be critical.
#   EXECUTE n1 n2      passive or skill: times n1 damage against a target below health share n2.
#   ARMOR_PIERCE n1    passive: share n1 of the damage the defence of the target stopped goes through (melee).
#   BONUS_VS_DOT n1, BONUS_VS_SLOWED n1, BONUS_VS_FROZEN n1, BONUS_VS_FLEEING n1, BONUS_VS_BACKLINE n1
#                      passive or skill: times n1 damage against a target with a damage over time, a slowed, a frozen,
#                      a fleeing target, or a target of the healer, marksman or mage group.
#   IGNORE_DODGE n1    reserved (read, no effect yet: the avoidance of shots is rolled by the missile).
#   AURA_LINGER n1     passive: the auras of the creature last n1 turns longer.
#   AURA_DOUBLE n1     passive: once per fight an aura of the creature is doubled and lasts n1 turns.
#   FOCUS_TARGET       MARK: the creatures of the caster's side prefer the marked creature as target.
#   BURNING_GROUND n1 n2 n3  EXPLOSION and missile skills (GRENADE): the ground within n3 tiles of the target burns
#                      for n2 turns with n1 damage per turn (scaled as the skill tree spells).
#   CHASE n1           passive: while an enemy in sight flees the creature walks n1 times faster.
#   DASH n1 n2         passive: once per fight, when it starts fighting, the creature walks n1 times faster for n2
#                      turns.
#
# [Template] ... [/Template]   a point order of a skill group; every group has three templates
#   Group        the skill group
#   Index        1, 2 or 3 (the 0-based index of the template is this number minus 1)
#   Name         display name (rest of the line)
#   Primary      the name of the path that gets the first 15 points (rest of the line)
#   Alternative  the name of the path that points deviating from the template go to (rest of the line)
#
# Settings in global.cfg: SkillPointFirstLevel, SkillRanksPerSkill, SkillTemplateDeviationPercent, SkillRespecChickens,
# SkillRespecWindowSeconds, SkillSpellReferenceMinHP, SkillHealSelfBelow, SkillHealAllyBelow, SkillHealAreaBelow,
# SkillHealAreaMinCreatures. The per-type keys SkillGroup, SkillFamily, PreSkill and TierFourSkill are in creatures.cfg.

