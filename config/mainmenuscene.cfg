# The campaign scene: entities and lights that appear once the campaign flight has passed its first waypoint (the gate)
# and disappear again once the return flight has passed its last waypoint before the overview. Show names an entity
# (with its particle effects) or ShowLight a light shown only in the campaign scene; Hide names an entity shown only
# outside it. The section is empty: the forecourt and the green portal belong to the whole scene, so the start screen
# sees them through the portcullis from its first frame and no flight switches anything on or off.
[MenuCampaignScene]
[/MenuCampaignScene]

# Named camera poses use CameraMove's local X/Y/Z degree rotation order.
# Flights specify interface seconds and ordered waypoints after the current pose.
# The arrival starts outside the yard; every destination has a reversed return route.
# FlightFrom names the place a flight starts from (it is flown only from there); its way back to the overview is its
# reversed route followed by the way back of that place.
[MenuCamera]
Pose overview 0 -29 5.2 93.5 0 0
# Keep the return flight at overview height and pitch so the horizon scenery stays in view.
Pose arrival 0 -38 5.2 93.5 0 0
Pose arrival_approach 0 -34 5.2 93.5 0 0
Pose gate_entry 0.2 3 3.5 90 0 0
Pose gate_exit 0.2 12 3.5 78 0 0
Pose campaign 0 19 7 29.5 0 0
Pose right_front 15 -3 4.5 86 -18 0
Pose skirmish 19 4.4 2.8 80 0 0
Pose left_outside -33 4 12 82 -12 0
Pose left_arcade -32 17 13 85 -50 0
Pose multiplayer -20 18 13 83 0 0
Pose left_front -20.5 1 3.5 83 0 0
Pose replay -20.5 4 2.6 81 0 0
Pose editor 23.2 3.4 3.4 60 0 0
Pose tower_approach 12 -1 20 56 24 0
Pose settings 8.7 3.8 17.5 45 0 0
# Start of a campaign level: from the table the camera lifts its view to the green portal, glides over the table, flies
# along the clear path across the forecourt between the fire bowls and into the green fire; the loading screen comes
# when it is there.
Pose portal_turn 0 21.5 4.8 80 0 0
Pose portal_court 0 38 3.8 89 0 0
Pose portal_front 0 53 3.8 90 0 0
Pose portal 0 58.55 3.8 90 0 0
Flight arrival 2.4 arrival_approach overview
Flight overview 2 overview
