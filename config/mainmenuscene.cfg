# Crows perch and watch (Watch loops every eight seconds, so the watch time is a multiple of it), then take off with a real wing beat,
# fly out and away (Flap, nine tiles per second so four beats cover eighteen tiles), wait out of sight and glide back to land (Land) on their perch.
[RenderSceneGroup]
*Repeat
AnimationTime CrowA Watch 8
AnimationOnce CrowA TakeOff
TurnEntity CrowA Flap -8 14 0 0.5
MoveEntity CrowA Flap 9 -21.4 22 16.94928741
PosEntity CrowA -21.4 22 -200 -8 14 0
Wait 5
PosEntity CrowA 2.6 8 8.94928741 -8 -14 0
MoveEntity CrowA FlapIn 9 -5.4 -6 0.94928741
AnimationOnce CrowA Land
PosEntity CrowA -5.4 -6 0.94928741 -8 -14 0
TurnEntity CrowA Watch 0 -1 0 0.8
[/RenderSceneGroup]

[RenderSceneGroup]
*Repeat
AnimationTime CrowB Watch 16
AnimationOnce CrowB TakeOff
TurnEntity CrowB Flap 8 14 0 0.5
MoveEntity CrowB Flap 9 21.7 21.6 16.8799057
PosEntity CrowB 21.7 21.6 -200 8 14 0
