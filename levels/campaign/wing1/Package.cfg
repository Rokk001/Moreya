# Wing package of the campaign of Moreya: the levels of one wing (3 story levels and its bonus level).
# The game reads every folder with a Package.cfg below levels/campaign/ of the game data and below the
# folder named by the environment variable MOREYA_CONTENT_DIR; a wing without a package is shown locked
# on the campaign map ("Coming in Early Access"). Story levels are played in wing order and in the order
# of this file; a story level is unlocked when all story levels before it are completed. A bonus level is
# unlocked when the hidden stone in the first story level of its wing found it (level script action
# "discover"). Every level starts fresh: nothing is carried from one level to the next.
#
# [Level]       starts a new level entry
# File          campaign name of the level, "campaign/<level file name>"; the progress, saved games and
#               level scripts use it. The level file of that name lies in this folder.
# Title         name shown in the campaign menu
# Briefing      text shown before the level (\n starts a new line)
# Debriefing    text shown after the level was won
# Preview       optional briefing image, relative to gui/campaign/
# Wing          wing of Moreya (1 to 6) the level belongs to, bonus levels too; one wing per package
# Bonus         1: bonus level of its wing (no raid, no Heartstone shard)
# Shard         1: the story level hides a shard of the Heartstone (level script
#               action "shard" when it is brought home). Optional.
# Champion      1: the level offers Summon champion once every Heartstone shard was
#               found (every level from wing 4 on). Optional.
# Unlock        bonus levels: qualities of the items that the first completion of
#               the level unlocks for good, one item per name (Common, Rare, Epic),
#               drawn at random from config/items.cfg; every unlocked item is for
#               sale once at the merchant of every level started afterwards. Optional.
# Warden        raid leader of a story level (both leaders when two raids come), shown in the
#               tooltip. Optional.
# Guild         story levels: the guild that raids the level, shown in front of the gate of the
#               campaign map while the level is the current one and in the tooltip of its cave, with
# GuildLeader   its named leader (with the last group or raid),
# GuildFirstLeader  the leader of the first raid when the two raids have different leaders (optional),
# GuildOrigin   its origin,
# GuildGroups   the number of groups or raids (1 or 2),
# GuildSize     the members of each group or raid,
# GuildKind     group or raid,
# GuildBanner   its banner and
# GuildPortrait the portrait of its leader, both relative to gui/campaign/.

[Level]
File=campaign/Brackenford.level
Wing=1
Preview=previews/wing1-level1.png
Warden=Elsa Brack
Title=Mold Pit
Briefing=My lord, our first guests are on their way. Elsa Brack is bringing the Mud Fists of Brackenford through the Moreya gate, one group of five who settle every argument with their fists.\n\nUntil the gate opens, keep your heart, two beds and a hatchery, claim the grove, dig across the dry ford, clear the landing and claim the keep. A stone lies hidden in the cellars; let a Ziv carry it home and a forgotten pit may open.\n\nThen break the raid and catch Elsa Brack before she runs back through the gate.
Debriefing=The Mud Fists came for gold and left their own: purses, boots and a few dented helmets now lie in your halls. Up in Hollowmark, Prince Aurel calls it a village brawl and tells the next guild to try harder.
Guild=The Mud Fists
GuildLeader=Elsa Brack
GuildOrigin=Brackenford
GuildGroups=1
GuildSize=5
GuildKind=group
GuildBanner=banners/mud-fists.png
GuildPortrait=portraits/elsa-brack.png

[Level]
File=campaign/Coldwell.level
Wing=1
Shard=1
Preview=previews/wing1-level2.png
Warden=Hugo Cole
Title=Drowned Larder
Briefing=Master, the Mud Fists have sent no word home, so Coldwell is trying its luck. Hugo Cole leads the Iron Latch through the Moreya gate to the Drowned Larder, one group of five, a few shields in front and many fists behind.\n\nUntil the gate opens, protect your heart, claim the well plaza, mine the 600 gold beneath it and break the keep's north gate. A shard of the Heartstone is hidden down here; let a Ziv carry it home.\n\nThen break the raid and catch Hugo Cole before he slips back through the gate.
Debriefing=The Iron Latch is open at last, and everything it carried stays in the larder: coin, chain shirts and a fine collection of keys to doors that are no longer theirs. Castellan's clerks strike another guild off the list, and Aurel sends for Wolfscar.
Guild=The Iron Latch
GuildLeader=Hugo Cole
GuildOrigin=Coldwell
GuildGroups=1
GuildSize=5
GuildKind=group
GuildBanner=banners/iron-latch.png
GuildPortrait=portraits/hugo-cole.png

[Level]
File=campaign/Ravensledge.level
Wing=1
Preview=previews/wing1-level3.png
Warden=Rolf Scarrow
Title=Wailing Ledges
Briefing=My lord, Wolfscar has stopped laughing. Rolf Scarrow brings the Grey Fang through the Moreya gate, one raid of ten, and his hunters prefer to shoot from a safe distance.\n\nUntil the gate opens, protect your heart, cross the lower bridge, claim 80 shelf tiles, then cross the upper bridge and break the inner gate.\n\nThen break the raid and catch Rolf Scarrow before he gets back to the gate; hunters hate being the prey.
Debriefing=The Grey Fang has lost its bite. Arrows, bows and a heavy purse of hunting wages lie among the shelves, and the banshees of the ledges have new bedding. The Rotting Cellars are yours, and the Blood Mines wait below.
Guild=The Grey Fang
GuildLeader=Rolf Scarrow
GuildOrigin=Wolfscar
GuildGroups=1
GuildSize=10
GuildKind=raid
GuildBanner=banners/grey-fang.png
GuildPortrait=portraits/rolf-scarrow.png

[Level]
File=campaign/Mossgate.level
Wing=1
Bonus=1
Unlock=Epic Rare Common
Preview=previews/wing1-bonus.png
Title=The Forgotten Pit
Briefing=Master, the stone from the Mold Pit has opened a chamber nobody has visited in an age. No raid will come here; only an old watch post still guards the meadow.\n\nProtect your heart, mine 60 gold and claim the meadow, then clear the watch post and its reinforcements.\n\nThe first time the chamber is yours, the merchant adds one Epic, one Rare and one Common item, chosen by chance, to his wares for every later level.
Debriefing=The watch post is silent and the Forgotten Pit is yours. If this was your first visit, the merchant has one Epic, one Rare and one Common item more in his pack, for sale in every level that follows; a second visit adds nothing but the pleasure of it.
