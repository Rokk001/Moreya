# Campaign of Moreya: 6 wings of 3 story levels each, and one bonus level per wing.
# Story levels are played in this order; a story level is unlocked when all story
# levels before it are completed. A bonus level is unlocked when the hidden stone
# in the first story level of its wing found it (level script action "discover").
# Every level starts fresh: nothing is carried from one level to the next.
#
# [Level]       starts a new level entry
# File          level file, relative to the "levels" directory
# Title         name shown in the campaign menu
# Briefing      text shown before the level (\n starts a new line)
# Debriefing    text shown after the level was won
# Preview       optional briefing image, relative to gui/campaign/
# Wing          wing of Moreya (1 to 6) the level belongs to, bonus levels too
# Bonus         1: bonus level of its wing (no raid, no Heartstone shard)
# Shard         1: the story level hides a shard of the Heartstone (level script
#               action "shard" when it is brought home). Optional.
# Champion      1: the level offers Summon champion once every Heartstone shard was
#               found (every level from wing 4 on). Optional.
# Unlock        bonus levels: qualities of the items that the first completion of
#               the level unlocks for good, one item per name (Common, Rare, Epic),
#               drawn at random from config/items.cfg; every unlocked item is for
#               sale once at the merchant of every level started afterwards. Optional.
# Warden        raid leader of a story level (both leaders when two raids come), shown in the
#               tooltip. Optional.
# Difficulty    1 (easy) to 5, shown in the tooltip. Optional.

[Level]
File=campaign/Brackenford.level
Wing=1
Preview=previews/wing1-level1.png
Warden=Elsa Brack
Difficulty=1
Title=Mold Pit
Briefing=My lord, our first guests are on their way. Elsa Brack is bringing the Mud Fists of Brackenford through the Moreya gate, one group of five who settle every argument with their fists.\n\nUntil the gate opens, keep your heart, two beds and a hatchery, claim the grove, cross the ford, clear the landing and claim the keep. A stone lies hidden in the cellars; let a Ziv carry it home and a forgotten pit may open.\n\nThen break the raid and catch Elsa Brack before she runs back through the gate.
Debriefing=The Mud Fists came for gold and left their own: purses, boots and a few dented helmets now lie in your halls. Up in Hollowmark, Prince Aurel calls it a village brawl and tells the next guild to try harder.

[Level]
File=campaign/Coldwell.level
Wing=1
Shard=1
Preview=previews/wing1-level2.png
Warden=Hugo Cole
Difficulty=1
Title=Drowned Larder
Briefing=Master, the Mud Fists have sent no word home, so Coldwell is trying its luck. Hugo Cole leads the Iron Latch through the Moreya gate to the Drowned Larder, one group of five, a few shields in front and many fists behind.\n\nUntil the gate opens, protect your heart, claim the well plaza, mine the 600 gold beneath it and break the keep's north gate. A shard of the Heartstone is hidden down here; let a Ziv carry it home.\n\nThen break the raid and catch Hugo Cole before he slips back through the gate.
Debriefing=The Iron Latch is open at last, and everything it carried stays in the larder: coin, chain shirts and a fine collection of keys to doors that are no longer theirs. Castellan's clerks strike another guild off the list, and Aurel sends for Wolfscar.

[Level]
File=campaign/Ravensledge.level
Wing=1
Preview=previews/wing1-level3.png
Warden=Rolf Scarrow
Difficulty=2
Title=Rat Warren
Briefing=My lord, Wolfscar has stopped laughing. Rolf Scarrow brings the Grey Fang through the Moreya gate, one raid of ten, and his hunters prefer to shoot from a safe distance.\n\nUntil the gate opens, protect your heart, cross the lower bridge, claim 80 shelf tiles, then cross the upper bridge and break the inner gate.\n\nThen break the raid and catch Rolf Scarrow before he gets back to the gate; hunters hate being the prey.
Debriefing=The Grey Fang has lost its bite. Arrows, bows and a heavy purse of hunting wages lie among the shelves, and the rats of the warren have new bedding. The Rotting Cellars are yours, and the Blood Mines wait below.

[Level]
File=campaign/Mossgate.level
Wing=1
Bonus=1
Unlock=Epic Rare Common
Preview=previews/wing1-bonus.png
Difficulty=1
Title=The Forgotten Pit
Briefing=Master, the stone from the Mold Pit has opened a chamber nobody has visited in an age. No raid will come here; only an old watch post still guards the meadow.\n\nProtect your heart, mine 60 gold and claim the meadow, then clear the watch post and its reinforcements.\n\nThe first time the chamber is yours, the merchant adds one Epic, one Rare and one Common item, chosen by chance, to his wares for every later level.
Debriefing=The watch post is silent and the Forgotten Pit is yours. If this was your first visit, the merchant has one Epic, one Rare and one Common item more in his pack, for sale in every level that follows; a second visit adds nothing but the pleasure of it.

[Level]
File=campaign/Tinmoor.level
Wing=2
Preview=previews/wing2-level1.png
Warden=Merrin Tay
Difficulty=2
Title=Bleeding Seam
Briefing=My lord, the Blood Mines draw miners, and Tinmoor sends its best. The Deep Picks come through the Moreya gate in two groups of five, shields first, and Merrin Tay leads the second.\n\nUntil the gate opens, protect your heart, mine 900 gold, scout the seams through a possessed creature and clear both watch posts with their reinforcements. A sealed vault may hold a stone; let a Ziv carry it home and a hidden hall opens.\n\nThen break both groups and catch Merrin Tay before she runs for the gate.
Debriefing=The Deep Picks dug their own grave and paid for the shovels. Their picks, helmets and every coin they hoped to carry home stay in the Bleeding Seam. Aurel tells the court that mines were always a poor investment.

[Level]
File=campaign/Greywater.level
Wing=2
Shard=1
Preview=previews/wing2-level2.png
Warden=Corwin Gray
Difficulty=2
Title=Chain Gallery
Briefing=Master, the Drowned Oath of Greywater has sworn to carry your gold up the river. Corwin Gray brings them through the Moreya gate in two groups of five and leads the second himself.\n\nUntil the gate opens, protect your heart, mine 600 gold, then cross the river and attack the heroes besieging the other keeper. Another shard of the Heartstone is hidden in these galleries; let a Ziv carry it home.\n\nThen break both groups and catch Corwin Gray before he reaches the gate.
Debriefing=The Drowned Oath has kept its name. Gray's people left their iron, their pay and a good deal of river water behind, and the Chain Gallery has new chains. Castellan's council asks why the guilds keep failing, and nobody volunteers an answer.

[Level]
File=campaign/Highcairn.level
Wing=2
Preview=previews/wing2-level3.png
Warden=Hilde Cairn
Difficulty=4
Title=Slag Pit
Briefing=My lord, the Stone Crown of Highcairn climbs down where others fell. Two raids of ten come through the Moreya gate, shields in front and bows behind, and Hilde Cairn leads the second.\n\nUntil the gate opens, build a bed and a hatchery, protect your heart, climb the four terraces in order, defeat the watch captain and open the hold.\n\nThen break both raids and catch Hilde Cairn before she reaches the gate.
Debriefing=The Stone Crown lies in the slag, and its jewels with it: shields, bows and a chest of coin the mountain folk saved for a better day. The Blood Mines are yours. Above, Prince Aurel stops laughing and starts making promises.

[Level]
File=campaign/CrowshotGallery.level
Wing=2
Bonus=1
Unlock=Epic Rare Common
Preview=previews/wing2-bonus.png
Difficulty=2
Title=The Gallery of Crows
Briefing=My lord, the stone from the Bleeding Seam has opened an old shooting gallery above a lava lake. No raid comes here, only hornets nesting on the islets.\n\nProtect your heart, possess one of your shooters and bring down all three flocks before time runs out.\n\nThe first time the gallery falls silent, the merchant adds one Epic, one Rare and one Common item, chosen by chance, to his wares for every later level.
Debriefing=Not a wing is left over the lava. If this was your first visit, the merchant now carries one Epic, one Rare and one Common item more, for sale in every level that follows; a second visit brings only target practice.

[Level]
File=campaign/Lanternhill.level
Wing=3
Preview=previews/wing3-level1.png
Warden=Ines Vale
Difficulty=3
Title=Ossuary
Briefing=Master, the Weeping Crypts have a visitor who brings her own light. Ines Vale leads the Pale Flame of Lanternhill through the Moreya gate, one group of ten, shields and bows together.\n\nUntil the gate opens, mine 700 gold, protect your heart, open the ring road, claim the crypt and the library, and destroy the northern rival heart with all enemy forces. A pale stone hides somewhere in the hill; let a Ziv carry it home and a hidden hall opens.\n\nThen break the group and catch Ines Vale before she reaches the gate.
Debriefing=The Pale Flame is out. Lamps, oil, shields and a purse of lamplighters' wages stay in the Ossuary, and the rival keeper's heart is as cold as its bones. Aurel writes to Saltmere that crypts are no place for amateurs.

[Level]
File=campaign/Saltmere.level
Wing=3
Shard=1
Preview=previews/wing3-level2.png
Warden=Bram Seward
Difficulty=3
Title=Tomb of Whispers
Briefing=My lord, the Salt Wolves of Saltmere smell treasure in the Tomb of Whispers. Bram Seward brings one group of ten through the Moreya gate, a little of everything with shields in front.\n\nUntil the gate opens, protect your heart, mine 800 gold, cross the flats and lagoons and breach both port gates. The third shard of the Heartstone is hidden here; let a Ziv carry it home.\n\nThen break the group and catch Bram Seward before he reaches the gate.
Debriefing=The Salt Wolves have been salted. Their cutlasses, coats and a chest of harbour coin stay in the tomb, which whispers a little more contentedly now. Castellan orders the Order of the White Thorn to pray harder and march sooner.

[Level]
File=campaign/HollinFen.level
Wing=3
Preview=previews/wing3-level3.png
Warden=Agathe Hollin
Difficulty=3
Title=Bone Chapel
Briefing=Master, the Order of the White Thorn comes from Hollin Fen to cleanse the Bone Chapel. Agathe Hollin leads one raid of twenty-five through the Moreya gate, and so many of them heal that every wound you give them closes twice.\n\nUntil the gate opens, build nine beds and a hatchery, protect your heart, claim 40 causeway tiles and break the convent's west gate.\n\nThen break the raid and catch Agathe Hollin before she reaches the gate.
Debriefing=The White Thorn has lost its petals. Holy water, white robes and the Order's alms box lie in the chapel, and the bones there do not mind the company. The Weeping Crypts are yours, and the Chained Depths wait below.

[Level]
File=campaign/SkittleCavern.level
Wing=3
Bonus=1
Unlock=Epic Rare Common
Preview=previews/wing3-bonus.png
Difficulty=2
Title=The Skull Lanes
Briefing=Master, the pale stone from the Ossuary has opened the Skull Lanes, an old cavern of boulder traps. No raid comes here; stone-faced guards take their places as soon as a lane is opened.\n\nProtect your heart, open all four lanes and bowl down all ten guards with the boulders within 540 seconds.\n\nThe first time the lanes lie quiet, the merchant adds one Epic, one Rare and one Common item, chosen by chance, to his wares for every later level.
Debriefing=The last guard has fallen and the lanes lie quiet. If this was your first visit, the merchant now offers one Epic, one Rare and one Common item more in every level that follows; a second game wins nothing but the score.

[Level]
File=campaign/Cinderhollow.level
Wing=4
Champion=1
Preview=previews/wing4-level1.png
Warden=Pell Ashgrove
Difficulty=4
Title=Rack Hall
Briefing=My lord, the Ember Ram of Cinderhollow means to knock on the Rack Hall with its head. Two groups of ten come through the Moreya gate, all shields and stubbornness, and Pell Ashgrove leads the second.\n\nUntil the gate opens, protect your heart, empty both starting gold seams, cross the lava bridge to the crater and destroy the rival heart with all enemy forces. A stone lies in an ash pocket; let a Ziv carry it home and a hidden hall opens. If you have found all three shards of the Heartstone, Summon Champion is yours in this wing and every one after it.\n\nThen break both groups and catch Pell Ashgrove before the gate.
Debriefing=The Ember Ram broke its horns on your walls. Battered shields, a ram's head banner and a sack of coin stay in the Rack Hall. Aurel assures the king that the next guild will not be so thick-headed.

[Level]
File=campaign/Ashcombe.level
Wing=4
Champion=1
Preview=previews/wing4-level2.png
Warden=Liesl Ashby
Difficulty=2
Title=Iron Maw
Briefing=Master, the Burnt Wheel of Ashcombe rolls into the Iron Maw. Liesl Ashby brings them through the Moreya gate in two groups of ten, leads the second and keeps her way out in mind from the first step.\n\nUntil the gate opens, protect your heart and cross the ash basin.\n\nThen break both groups and catch Liesl Ashby before she runs back through the gate; she is quick when it matters.
Debriefing=The Burnt Wheel stopped turning before it reached the gate. Ashby's people left their armour, their axes and the travel money they meant to spend above. The Iron Maw has swallowed another guild.

[Level]
File=campaign/Ironbridge.level
Wing=4
Champion=1
Preview=previews/wing4-level3.png
Warden=Gareth Fenn
Difficulty=3
Title=Torment Cells
Briefing=My lord, Ironbridge has forged its finest for you. Gareth Fenn brings the Anvil Host through the Moreya gate in two raids of twenty-five, so heavily armoured that they clank when they think, and leads the second himself.\n\nUntil the gate opens, build six beds and a hatchery, protect your heart, cross the three rifts in order, claim the north smithy and the ore dock, then breach the hold and destroy its heart and enemy forces.\n\nThen break both raids and catch Gareth Fenn before he reaches the gate.
Debriefing=The Anvil Host has been hammered flat. Their plate, their shields and a forge master's purse now furnish the Torment Cells, and the Chained Depths are yours. Prince Aurel announces that he will see to the matter himself, soon.

[Level]
File=campaign/SwarmNight.level
Wing=4
Bonus=1
Champion=1
Unlock=Epic Rare Common
Preview=previews/wing4-bonus.png
Difficulty=3
Title=The Swarming Dark
Briefing=My lord, the stone from the Rack Hall has opened the Swarming Dark, where a rival keeper sends his swarms against you all night long. No raid comes here.\n\nProtect your heart and survive until dawn, thirteen minutes from now.\n\nThe first time you see the dawn here, the merchant adds one Epic, one Rare and one Common item, chosen by chance, to his wares for every later level.
Debriefing=The first light touches the roads and the swarm melts away. If this was your first night here, the merchant now carries one Epic, one Rare and one Common item more in every level that follows; another night brings only another sunrise.

[Level]
File=campaign/Bellwick.level
Wing=5
Champion=1
Preview=previews/wing5-level1.png
Warden=Lorens Bell
Difficulty=4
Title=Charnel Stair
Briefing=Master, the Silent Bell of Bellwick comes to bury the Black Catacombs in prayer. Lorens Bell leads one group of twenty-five through the Moreya gate, with more monks than a quiet guild should need.\n\nUntil the gate opens, protect your heart, pass through the nave to the transept and destroy the undercroft heart with all enemy forces. A stone hides in a chamber of the abbey; let a Ziv carry it home and a hidden hall opens.\n\nThen break the group and catch Lorens Bell before he reaches the gate.
Debriefing=The Silent Bell has finally lived up to its name. Robes, prayer beads, sturdy staves and the abbey's collection box stay on the Charnel Stair. Aurel's court hears the news in silence, which is only fitting.

[Level]
File=campaign/Goldspire.level
Wing=5
Champion=1
Preview=previews/wing5-level2.png
Warden=Alaric Penn
Difficulty=4
Title=Corpse Gate
Briefing=My lord, the Gilded Hand of Goldspire wants to audit your treasury. Alaric Penn leads one group of twenty-five through the Moreya gate, shields in front, bows behind and a ledger for everything they take.\n\nUntil the gate opens, raise two fighters, protect your heart, capture the low town, pass the south gate, the outer ring and both sealed links, and unlock the vault.\n\nThen break the group and catch Alaric Penn before he reaches the gate.
Debriefing=The Gilded Hand has paid in full. Gold rings, fine armour and every coin in Penn's ledger now belong to the Corpse Gate, and the ledger itself makes good kindling. Prince Aurel is coming down himself.

[Level]
File=campaign/Kingsfall.level
Wing=5
Champion=1
Preview=previews/wing5-level3.png
Warden=Prince Aurel
Difficulty=5
Title=Hall of Skulls
Briefing=Master, the prince has run out of guilds to laugh at. Prince Aurel leads the Sun Court of Kingsfall through the Moreya gate himself, one raid of forty, shields and bows in their brightest colours.\n\nHis champions Falconer Edda, Huntsman Brann and Squire Wick came ahead to hunt in the Hall of Skulls. Until the gate opens, protect your heart, cross a guarded lava bridge, capture or convert all three champions alive and gather twelve creatures at your heart.\n\nThen break the raid and catch the prince before he runs back through the gate.
Debriefing=The Sun Court has set. Gilded armour, royal bows and the prince's own purse stay in the Hall of Skulls, and his three champions stay with you. The Black Catacombs are yours, and in Hollowmark the High King is calling for his crown.

[Level]
File=campaign/BoulderCourse.level
Wing=5
Bonus=1
Champion=1
Unlock=Epic Rare Common
Preview=previews/wing5-bonus.png
Difficulty=2
Title=The Rolling Tomb
Briefing=Master, the stone from the Charnel Stair has opened the Rolling Tomb, where an old crew once rolled stone balls down the galleries to test their aim. No raid comes here.\n\nProtect your heart and sink all four boulders into their cups within 600 seconds and 80 slaps.\n\nThe first time every boulder rests, the merchant adds one Epic, one Rare and one Common item, chosen by chance, to his wares for every later level.
Debriefing=Every boulder rests in its cup. If this was your first visit, the merchant now offers one Epic, one Rare and one Common item more in every level that follows; another round earns only sore hands.

[Level]
File=campaign/VarnsCrossing.level
Wing=6
Champion=1
Preview=previews/wing6-level1.png
Warden=Marshal Varn
Difficulty=5
Title=Ember Pit
Briefing=My lord, the Abyssal Heart draws the heaviest guests. Marshal Varn marches the Black Legion of Varn's Crossing through the Moreya gate in two groups of twenty-five, a wall of shields, and comes with the second.\n\nUntil the gate opens, claim your quarter, build a bed and a hatchery, guard your heart, capture and hold the lava-ringed fortress and destroy both rival hearts with all enemy forces. A stone hides in a chamber of the pit; let a Ziv carry it home and a hidden hall opens.\n\nThen break both groups and catch Marshal Varn before he reaches the gate.
Debriefing=The Black Legion has broken ranks for good. Black shields, the marshal's standard and the Legion's pay chest stay in the Ember Pit. Up above, the High King counts the guilds he has left and does not need many fingers.

[Level]
File=campaign/Wraithwood.level
Wing=6
Champion=1
Preview=previews/wing6-level2.png
Warden=Elowen Ash
Difficulty=5
Title=Throne of Ash
Briefing=Master, the Ash Coven of Wraithwood answers the High King's call. Two groups of twenty-five come through the Moreya gate, shields to hold you and casters to burn what is held, and Elowen Ash leads the second.\n\nUntil the gate opens, protect your heart, destroy the northwestern and the northeastern rival hearts and defeat all remaining enemy forces.\n\nThen break both groups and catch Elowen Ash before she reaches the gate.
Debriefing=The Ash Coven has gone up in its own smoke. Staffs, charms and a coven purse heavy with silver stay on the Throne of Ash. In Hollowmark, High King Castellan puts on his crown and calls for his last raid.

[Level]
File=campaign/HollowmarkCitadel.level
Wing=6
Champion=1
Preview=previews/wing6-level3.png
Warden=Sabine Rook and High King Castellan
Difficulty=5
Title=Heart of Moreya
Briefing=My lord, the High King has run out of guilds and comes down himself. The Crown Eternal of Hollowmark Citadel comes through the Moreya gate in two raids of forty with every role in its ranks: Sabine Rook leads the first raid, High King Castellan the second.\n\nUntil the gate opens, protect your heart and take the royal treasuries, cross the three courts by their towers or gate keys and claim the throne hall.\n\nThen break both raids and catch both leaders before either of them reaches the gate.
Debriefing=The Crown Eternal was not. Royal armour, the banners of Hollowmark, the treasury the king brought to pay his raid and the crown itself now lie in the Heart of Moreya. Master, the surface has run out of kings; Moreya is yours, and business can go back to normal.

[Level]
File=campaign/TwistingHalls.level
Wing=6
Bonus=1
Champion=1
Unlock=Epic Rare Common
Preview=previews/wing6-bonus.png
Difficulty=3
Title=The Twisting Abyss
Briefing=Master, the stone from the Ember Pit has opened the Twisting Abyss, halls that twist like a knot with a trap in every corner. No raid comes here.\n\nProtect your heart, possess a creature of your own and reach the north-east exit before time runs out.\n\nThe first time you find the way out, the merchant adds one Epic, one Rare and one Common item, chosen by chance, to his wares for every later level.
Debriefing=The exit is reached and the Twisting Abyss lets you go. If this was your first visit, the merchant now offers one Epic, one Rare and one Common item more in every level that follows; another walk through the maze is for your nerves only.
